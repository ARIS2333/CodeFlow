databases:
  # Free plan while the schema and auth work is still in development.
  #
  # THIS INSTANCE EXPIRES 30 DAYS AFTER IT IS CREATED. There is then a 14-day
  # grace period to upgrade to a paid plan, which keeps the data; after that
  # Render deletes the database and everything in it. Upgrade to 0.1c-256mb
  # ($6/month) before collecting any participant data — see DEPLOYMENT.md.
  #
  # The free plan also has no backups, no managed connection pooling, a 1 GB
  # storage cap, and allows only one free instance per workspace.
  - name: codeflow-db
    plan: free
    databaseName: codeflow
    user: codeflow
    region: oregon

services:
  - type: web
    name: codeflow-backend
    runtime: python
    branch: production
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -c gunicorn.conf.py app:app
    # Applies schema changes once per deploy, before the new version serves
    # traffic. Do not create tables at import time: the workers would race.
    preDeployCommand: alembic upgrade head
    healthCheckPath: /health
    # Must match the database's region so DATABASE_URL resolves to the private
    # network URL rather than the slower public one.
    region: oregon
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: codeflow-db
          property: connectionString
      # Per-worker pool. WEB_CONCURRENCY * (DB_POOL_SIZE + DB_MAX_OVERFLOW)
      # must stay below the instance's 100-connection limit.
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "5"
      - key: MODEL_PROVIDER
        value: dashscope
      - key: DASHSCOPE_API_KEY
        sync: false
      - key: DASHSCOPE_WORKSPACE_ID
        sync: false
      - key: QWEN_MODEL
        value: qwen3.7-max
      - key: WEB_CONCURRENCY
        value: "2"
      - key: GUNICORN_THREADS
        value: "50"

  - type: web
    name: codeflow-frontend
    runtime: static
    branch: production
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      # Use the backend's public HTTPS URL, without a trailing slash.
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
