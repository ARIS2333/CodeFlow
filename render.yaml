services:
  - type: web
    name: codeflow-backend
    runtime: python
    plan: free
    branch: UF_1_toolEval
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Run the idempotent schema initializer before every web-server start. It
    # creates or migrates participant accounts, immutable submissions, study
    # progress, and per-question workspace recovery in the linked database.
    startCommand: python init_db.py && gunicorn -c gunicorn.conf.py app:app
    healthCheckPath: /health
    envVars:
      # One existing Render Postgres database stores accounts, submissions,
      # navigation progress, source drafts, and generated feedback. No second
      # database or additional persistence environment variable is required.
      - key: DATABASE_URL
        fromDatabase:
          name: codeflow-study-db
          property: connectionString
      # Registered study browsers use these server-owned model credentials.
      - key: API_KEY
        sync: false
      - key: BASE_URL
        sync: false
      - key: MODEL
        sync: false
      - key: PROVIDER
        sync: false
      - key: WEB_CONCURRENCY
        value: "2"
      - key: GUNICORN_THREADS
        value: "50"
      # One compiler process per Gunicorn worker (two total with WEB_CONCURRENCY=2).
      - key: CPP_COMPILE_CONCURRENCY
        value: "1"
      - key: CPP_COMPILE_TIMEOUT_SECONDS
        value: "5"
      - key: CPP_COMPILE_QUEUE_SECONDS
        value: "10"

  - type: web
    name: codeflow-frontend
    runtime: static
    branch: UF_1_toolEval
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      # Use the backend's public HTTPS URL, without a trailing slash.
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
