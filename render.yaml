services:
  - type: web
    name: codeflow-backend
    runtime: python
    plan: free
    branch: main
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -c gunicorn.conf.py app:app
    healthCheckPath: /health
    envVars:
      # Set the API access password in the Render dashboard, never in Git.
      - key: ADMIN_PASSWORD
        sync: false
      - key: API_KEY
        sync: false
      - key: BASE_URL
        sync: false
      - key: MODEL
        sync: false
      - key: PROVIDER
        sync: false
      - key: WEB_CONCURRENCY
        value: "1"
      - key: GUNICORN_THREADS
        value: "4"
      # One compiler process on the free demo instance.
      - key: CPP_COMPILE_CONCURRENCY
        value: "1"
      - key: CPP_COMPILE_TIMEOUT_SECONDS
        value: "5"
      - key: CPP_COMPILE_QUEUE_SECONDS
        value: "10"
      # Opt in explicitly in the Render dashboard. When disabled or when native
      # instrumentation cannot handle a source shape, the UI falls back to the
      # model-generated trace.
      - key: ENABLE_NATIVE_CPP_TRACE
        sync: false
      - key: ENABLE_NATIVE_PYTHON_TRACE
        sync: false
      - key: PYTHON_TRACE_RUN_TIMEOUT_SECONDS
        value: "3"
      # Instrumented trace builds are larger than syntax-only compiler checks.
      # Two programs are compiled sequentially within the frontend's 90s wait.
      - key: CPP_TRACE_COMPILE_TIMEOUT_SECONDS
        value: "30"
      - key: CPP_TRACE_RUN_TIMEOUT_SECONDS
        value: "3"

  - type: web
    name: codeflow-frontend
    runtime: static
    branch: main
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      # Use the backend's public HTTPS URL, without a trailing slash.
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
