services:
  - type: web
    name: codeflow-backend
    runtime: python
    branch: main
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -c gunicorn.conf.py app:app
    healthCheckPath: /health
    envVars:
      # Unlocks the shared research model. Set it in the Render dashboard, never
      # in this file: the repository is public. Leaving it unset disables
      # research mode, making the deployment bring-your-own-key only.
      - key: RESEARCH_PASSWORD
        sync: false
      - key: API_KEY
        sync: false
      - key: BASE_URL
        sync: false
      - key: MODEL
        sync: false
      - key: PROVIDER
        sync: false
      - key: WEB_CONCURRENCY
        value: "2"
      - key: GUNICORN_THREADS
        value: "50"

  - type: web
    name: codeflow-frontend
    runtime: static
    branch: main
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      # Use the backend's public HTTPS URL, without a trailing slash.
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
