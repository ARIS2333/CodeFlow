services:
  - type: web
    name: codeflow-backend
    runtime: python
    plan: free
    branch: UF_1_toolEval
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python init_db.py && gunicorn -c gunicorn.conf.py app:app
    healthCheckPath: /health
    envVars:
      # Links the existing Render Postgres instance by resource name. The
      # backend receives its internal connection URL automatically.
      - key: DATABASE_URL
        fromDatabase:
          name: codeflow-study-db
          property: connectionString
      # Unlocks the shared research model. Set it in the Render dashboard, never
      # in this file: the repository is public. Leaving it unset disables
      # research mode, making the deployment bring-your-own-key only.
      - key: RESEARCH_PASSWORD
        sync: false
      - key: API_KEY
        sync: false
      - key: BASE_URL
        sync: false
      - key: MODEL
        sync: false
      - key: PROVIDER
        sync: false
      - key: WEB_CONCURRENCY
        value: "2"
      - key: GUNICORN_THREADS
        value: "50"
      # One compiler process per Gunicorn worker (two total with WEB_CONCURRENCY=2).
      - key: CPP_COMPILE_CONCURRENCY
        value: "1"
      - key: CPP_COMPILE_TIMEOUT_SECONDS
        value: "5"
      - key: CPP_COMPILE_QUEUE_SECONDS
        value: "10"

  - type: web
    name: codeflow-frontend
    runtime: static
    branch: UF_1_toolEval
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      # Use the backend's public HTTPS URL, without a trailing slash.
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
